name = "wildroot"
compatibility_date = "2026-08-23"
main = "./worker.js"

[[durable_objects.bindings]]
name = "VILLAGE_SNAPSHOTS"
class_name = "VillageSnapshot"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VillageSnapshot"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
exclude = [".git/**", ".github/**", "tests/**", "presentation/**", "*.md", ".DS_Store", "wrangler.toml", "worker.js"]
