<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>RUNNING</title>
<style>body{font-family:monospace} iframe{width:1400px;height:1000px;border:0}</style>
</head><body><pre id="result">RUNNING</pre>
<iframe id="game" src="../index.html?test=lifecycle-events"></iframe>
<script>
  const people = Array.from({ length: 10 }, (_, index) => {
    const deathAgeDays = index === 0 ? 40 : 40 + index * 2 % 21;
    const birthAt = index === 0 ? 10.2505 - deathAgeDays : 10.25 - (7 + index);
    return {
      id: index + 1,
      name: index === 0 ? "Aster Wayfarer" : `Resident ${index + 1}`,
      ageGroup: "adult",
      origin: index === 0 ? "traveller" : "established",
      joinedDay: index === 0 ? 2 : 1,
      joinedAt: index === 0 ? 2 : 1,
      birthAt,
      deathAgeDays,
      lifeEndsAt: birthAt + deathAgeDays,
      carryCapacity: 1 + index % 3
    };
  });
  localStorage.setItem("wildroot-village-save-v1", JSON.stringify({
    version: 2,
    villageName: "Life Cycle Test",
    difficulty: "balanced",
    day: 10,
    dayProgress: .25,
    speed: 1,
    paused: true,
    weather: "mild",
    weatherFrom: "mild",
    weatherBlend: 1,
    weatherStartedAt: 9,
    weatherDurationDays: 2,
    nextWeatherChange: 11,
    nextEventDay: 10.252,
    population: 10,
    demographics: { children: 0, adults: 10, elders: 0 },
    education: 28,
    health: 92,
    happiness: 82,
    resources: { food: 120, water: 130, wood: 95, stone: 60 },
    ecosystem: { forest: 92, wildlife: 87, water: 91, soil: 89, air: 96, biodiversity: 90 },
    terrainSeed: 913472,
    buildings: [{ type: "hearth", x: 49, y: 49, rotation: 0, builtDay: 1, id: 1 }],
    people,
    nextPersonId: 11,
    pendingTravellerResidents: 0,
    nextBuildingId: 2,
    camera: { x: 50, y: 50, zoom: .85 },
    stats: { naturalDeaths: 0, travellerDeaths: 0, travellingSettlersWelcomed: 0 }
  }));

  const frame = document.getElementById("game");
  const result = document.getElementById("result");
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  frame.addEventListener("load", async () => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const checks = [];
    const check = (name, pass, detail = "") => checks.push({ name, pass: Boolean(pass), detail });
    try {
      await wait(250);
      doc.getElementById("continueGameButton").click();
      await wait(120);
      const canvas = doc.getElementById("gameCanvas");
      check("all resident ages load with hidden 40–60 day limits", canvas.dataset.lifespansTracked === "10" && canvas.dataset.residentLifespanMinDays === "40" && canvas.dataset.residentLifespanMaxDays === "60", `${canvas.dataset.lifespansTracked} tracked · ${canvas.dataset.residentLifespanMinDays}–${canvas.dataset.residentLifespanMaxDays} days`);
      check("traveller lifespan rule is exposed", canvas.dataset.travellerLifespanMinDays === "20" && canvas.dataset.travellerLifespanMaxDays === "40" && canvas.dataset.travellingResidents === "1", `${canvas.dataset.travellerLifespanMinDays}–${canvas.dataset.travellerLifespanMaxDays} days`);

      const travellerLifespans = Array.from({ length: 100 }, (_, index) => win.__wildrootTest.travellerLifespan(index + 1, 913472));
      check("traveller lifespans stay between 20 and 40 days", Math.min(...travellerLifespans) >= 20 && Math.max(...travellerLifespans) <= 40 && new Set(travellerLifespans).size >= 15, `${Math.min(...travellerLifespans)}–${Math.max(...travellerLifespans)} · ${new Set(travellerLifespans).size} values`);
      const residentDeathAges = Array.from({ length: 100 }, (_, index) => win.__wildrootTest.residentDeathAge(index + 1, 913472));
      check("hidden natural death ages vary from 40 to 60 days", Math.min(...residentDeathAges) === 40 && Math.max(...residentDeathAges) === 60 && new Set(residentDeathAges).size >= 15, `${Math.min(...residentDeathAges)}–${Math.max(...residentDeathAges)} · ${new Set(residentDeathAges).size} values`);
      check("resident inspection shows age but no life expectancy", win.__wildrootTest.openResident(2) && doc.querySelector(".resident-modal")?.textContent.includes("Age") && !doc.querySelector(".resident-modal")?.textContent.includes("Lifespan") && !doc.querySelector(".resident-modal")?.textContent.includes("remaining") && !doc.querySelector(".resident-modal")?.textContent.includes("Expected final day"), doc.querySelector(".resident-modal")?.textContent || "no resident modal");
      doc.querySelector(".resident-modal .sheet-close").click();
      await wait(80);

      const minimumGap = win.__wildrootTest.eventGap(0, "balanced", 1);
      const maximumGap = win.__wildrootTest.eventGap(1, "balanced", 1);
      const gentleGap = win.__wildrootTest.eventGap(.5, "gentle", 1);
      const balancedGap = win.__wildrootTest.eventGap(.5, "balanced", 1);
      const harshGap = win.__wildrootTest.eventGap(.5, "harsh", 1);
      const lateGap = win.__wildrootTest.eventGap(.5, "balanced", 180);
      check("event timing spans three per day to one per seven days", Math.abs(minimumGap - 1 / 3) < .0001 && maximumGap === 7 && canvas.dataset.eventMaximumPerDay === "3", `${minimumGap.toFixed(3)}–${maximumGap.toFixed(0)} days`);
      check("difficulty and survival time bias event frequency", gentleGap > balancedGap && balancedGap > harshGap && lateGap < balancedGap, `${gentleGap.toFixed(2)} > ${balancedGap.toFixed(2)} > ${harshGap.toFixed(2)} · late ${lateGap.toFixed(2)}`);

      const eventIds = win.__wildrootTest.eventIds();
      check("expanded event pool includes fire flood and illness", ["wildfire", "flood", "village_illness", "pollinator_decline", "invasive_vines", "fallen_old_tree"].every(id => eventIds.includes(id)) && Number(canvas.dataset.randomEventCount) >= 15, `${eventIds.length} events`);

      const startingLife = win.__wildrootTest.residentLife(2).lived;
      doc.querySelector('[data-speed="1"]').click();
      win.__wildrootTest.step(300);
      const ageAt1x = win.__wildrootTest.residentLife(2).lived - startingLife;
      doc.querySelector('[data-speed="2"]').click();
      win.__wildrootTest.step(300);
      const ageAt2x = win.__wildrootTest.residentLife(2).lived - startingLife - ageAt1x;
      doc.querySelector('[data-speed="3"]').click();
      win.__wildrootTest.step(300);
      const ageAt3x = win.__wildrootTest.residentLife(2).lived - startingLife - ageAt1x - ageAt2x;
      check("resident ageing follows 1× 2× and 3× speed exactly", Math.abs(ageAt2x / ageAt1x - 2) < .0001 && Math.abs(ageAt3x / ageAt1x - 3) < .0001, `${ageAt1x.toFixed(6)} → ${ageAt2x.toFixed(6)} → ${ageAt3x.toFixed(6)} days`);
      check("resident expires at their individual final time", canvas.dataset.naturalDeaths === "1" && canvas.dataset.travellingResidents === "0" && canvas.dataset.lifespansTracked === "9" && Number(canvas.dataset.villagers) === 9, `${canvas.dataset.naturalDeaths} death · ${canvas.dataset.lifespansTracked} residents`);
      check("lifespan death is recorded by name", doc.getElementById("eventLog").textContent.includes("Aster Wayfarer"), doc.getElementById("eventLog").textContent);
      await wait(100);
      check("events can trigger within a day instead of only at day boundaries", Boolean(doc.querySelector(".event-modal")) && doc.querySelector(".event-modal .eyebrow")?.textContent.includes("DAY 10"), doc.querySelector(".event-modal")?.textContent || "no event modal");
      doc.querySelectorAll(".event-modal [data-choice]")[1].click();
      await wait(80);
      check("illness event opens with prevention and care choices", win.__wildrootTest.openEvent("village_illness") && doc.querySelectorAll(".event-modal [data-choice]").length === 3, doc.querySelector(".event-modal")?.textContent || "no illness event");
      doc.querySelector('.event-modal [data-choice="1"]').click();
      await wait(80);
      win.__wildrootTest.step(50);
      check("untreated illness circulates for about four days", canvas.dataset.illnessActive === "true" && Number(canvas.dataset.illnessRemainingDays) > 3.9 && Number(canvas.dataset.illnessRemainingDays) <= 4, `${canvas.dataset.illnessRemainingDays} days remaining`);
    } catch (error) {
      checks.push({ name: "uncaught test error", pass: false, detail: String(error?.stack || error) });
    }
    const passed = checks.every(item => item.pass);
    result.textContent = `${passed ? "PASS" : "FAIL"}\n` + checks.map(item => `${item.pass ? "✓" : "✗"} ${item.name}${item.detail ? ` — ${item.detail}` : ""}`).join("\n");
    document.title = passed ? "PASS" : "FAIL";
  }, { once: true });
</script>
</body></html>
