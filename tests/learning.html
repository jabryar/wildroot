<!doctype html>
<meta charset="utf-8">
<title>Wildroot environmental learning test</title>
<style>body{font-family:monospace} iframe{width:1400px;height:1000px;border:0}</style>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1400px;height:1000px;border:0"></iframe>
<script>
  localStorage.setItem("wildroot-village-save-v1", JSON.stringify({
    version: 2,
    villageName: "Learning Clearing",
    difficulty: "balanced",
    day: 4,
    dayProgress: .25,
    speed: 1,
    paused: true,
    weather: "mild",
    weatherFrom: "mild",
    weatherBlend: 1,
    nextWeatherChange: 99,
    nextEventDay: 100,
    population: 10,
    demographics: { children: 0, adults: 10, elders: 0 },
    resources: { food: 120, water: 130, wood: 95, stone: 60 },
    ecosystem: { forest: 85, wildlife: 85, water: 75, soil: 85, air: 85, biodiversity: 85 },
    terrainSeed: 12873465,
    buildings: [
      { type: "hearth", x: 49, y: 49, rotation: 0, builtDay: 1, id: 1 },
      { type: "granary", x: 54, y: 49, rotation: 0, builtDay: 2, id: 2 }
    ],
    nextBuildingId: 3,
    loggedTrees: {},
    clearedTiles: {},
    camera: { x: 50, y: 50, zoom: .85 }
  }));

  const frame = document.getElementById("game");
  const result = document.getElementById("result");
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const clickWorld = (win, canvas, worldX, worldY) => {
    const rect = canvas.getBoundingClientRect();
    const scale = 28 * .85;
    const options = {
      bubbles: true, pointerId: 71, pointerType: "mouse", button: 0, buttons: 1,
      clientX: rect.left + ((384 + (worldX - 50) * scale) / 768) * rect.width,
      clientY: rect.top + ((384 + (worldY - 50) * scale) / 768) * rect.height
    };
    canvas.dispatchEvent(new win.PointerEvent("pointermove", options));
    canvas.dispatchEvent(new win.PointerEvent("pointerdown", options));
    canvas.dispatchEvent(new win.PointerEvent("pointerup", { ...options, buttons: 0 }));
  };

  frame.addEventListener("load", async () => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const checks = [];
    const check = (name, pass, detail = "") => checks.push({ name, pass: Boolean(pass), detail });
    try {
      await wait(250);
      doc.getElementById("continueGameButton").click();
      await wait(450);
      const canvas = doc.getElementById("gameCanvas");
      check("live eco coach identifies the weak system", canvas.dataset.ecoCoachMetric === "water" && doc.getElementById("ecoCoachMetric").textContent.includes("Water quality"), `${canvas.dataset.ecoCoachMetric} · ${doc.getElementById("ecoCoachMetric").textContent}`);
      const ecoRates = win.__wildrootTest.ecoRates();
      const weightedRatesMatch = Object.keys(ecoRates.daily).every(metric => {
        const expected = ecoRates.day[metric] * ecoRates.dayFraction + ecoRates.night[metric] * (1 - ecoRates.dayFraction);
        return Math.abs(ecoRates.daily[metric] - expected) < 1e-9;
      });
      check("staffed effects make daytime and nighttime ecosystem rates distinct", Object.keys(ecoRates.day).some(metric => Math.abs(ecoRates.day[metric] - ecoRates.night[metric]) > 1e-9), JSON.stringify({ day: ecoRates.day, night: ecoRates.night }));
      check("eco coach calculates a weighted 24-hour average", weightedRatesMatch && canvas.dataset.ecoCoachRateDisplay === "24-hour-average" && Math.abs(Number(canvas.dataset.ecoCoachRate) - ecoRates.daily[canvas.dataset.ecoCoachMetric]) < .00051, `${canvas.dataset.ecoCoachRateDisplay} · ${canvas.dataset.ecoCoachRate}`);
      const dayCoach = win.__wildrootTest.ecoCoachAt(.25);
      const nightCoach = win.__wildrootTest.ecoCoachAt(.6);
      check("eco coach trend does not flip when night begins", !dayCoach.night && nightCoach.night && dayCoach.metric === nightCoach.metric && Math.abs(dayCoach.rate - nightCoach.rate) < 1e-9 && dayCoach.trend === nightCoach.trend, JSON.stringify({ dayCoach, nightCoach }));
      check("eco coach explains that its trend is a full-day average", doc.getElementById("ecoCoachText").textContent.includes("full-day average"), doc.getElementById("ecoCoachText").textContent);
      check("eco coach identifies modelled pressure and support", canvas.dataset.ecoCoachPressure === "Village population" && canvas.dataset.ecoCoachSupport === "Watershed recovery" && doc.getElementById("ecoCoachPressure").textContent.includes("Village population") && doc.getElementById("ecoCoachSupport").textContent.includes("Watershed recovery"), `${canvas.dataset.ecoCoachPressure} · ${canvas.dataset.ecoCoachSupport}`);
      check("eco coach explains system connections", doc.getElementById("ecoCoachConnection").textContent.includes("Water links weather, soil, plants, people and industry"), doc.getElementById("ecoCoachConnection").textContent);
      const finalObjective = win.__wildrootTest.finalObjective();
      check("freeplay has a fifth environmental legacy chapter", canvas.dataset.objectiveChapterCount === "5" && finalObjective.title === "A living legacy" && finalObjective.goals.length === 4 && finalObjective.goals.some(goal => goal.includes("every ecosystem indicator to 90+")) && finalObjective.goals.some(goal => goal.includes("100% ecosystem score")), `${canvas.dataset.objectiveChapterCount} · ${JSON.stringify(finalObjective)}`);
      check("completed older saves advance into the new final chapter", win.__wildrootTest.normalisedObjectiveChapter(3, [0, 1, 2, 3]) === 4);
      check("Perfect Balance requires displayed 100% on Harsh", win.__wildrootTest.perfectBalanceEligible("harsh", 99.5) && !win.__wildrootTest.perfectBalanceEligible("balanced", 100) && !win.__wildrootTest.perfectBalanceEligible("harsh", 99.49));
      check("learning layer has twenty field missions and twenty-two knowledge checks", canvas.dataset.learningLessonCount === "20" && canvas.dataset.learningQuestionCount === "22", `${canvas.dataset.learningLessonCount}/${canvas.dataset.learningQuestionCount}`);
      check("observed field missions become permanent learning", canvas.dataset.learningLessonsComplete === "1", canvas.dataset.learningLessonsComplete);

      const resourcesBefore = ["foodValue", "waterValue", "woodValue", "stoneValue"].map(id => doc.getElementById(id).textContent).join("|");
      doc.getElementById("fieldGuideButton").click();
      await wait(120);
      check("field guide opens", doc.getElementById("fieldGuideTitle")?.textContent === "Environmental field guide", doc.getElementById("fieldGuideTitle")?.textContent || "missing");
      check("all lessons explain principles, real-world context and missions", doc.querySelectorAll(".lesson-card").length === 20 && doc.querySelectorAll(".lesson-principle").length === 20 && doc.querySelectorAll(".lesson-context").length === 20 && doc.querySelectorAll(".lesson-mission").length === 20, `${doc.querySelectorAll(".lesson-card").length} cards`);
      check("guide covers expanded environmental topics", ["renewable_forestry", "living_soil", "water_cycle", "habitat_variety", "pollution_zoning", "resource_limits", "day_night_cycles", "food_webs", "clean_energy", "seasonal_resilience", "carrying_capacity", "restoration_portfolio", "ecological_thresholds", "habitat_networks", "circular_materials", "one_health", "nature_based_solutions", "future_generations"].every(id => doc.querySelector(`[data-lesson="${id}"]`)));
      check("field guide teaches noise pollution and residential buffers", (doc.querySelector('[data-lesson="pollution_zoning"]')?.textContent || "").includes("Noise is pollution") && (doc.querySelector('[data-lesson="pollution_zoning"]')?.textContent || "").includes("homes"), doc.querySelector('[data-lesson="pollution_zoning"]')?.textContent || "missing");
      check("guide includes model limits and a six-indicator evidence snapshot", Boolean(doc.querySelector("[data-learning-model-note]")) && doc.querySelectorAll("[data-eco-snapshot]").length === 6, `${doc.querySelectorAll("[data-eco-snapshot]").length} indicators`);

      const frozenClock = doc.getElementById("clockLabel").textContent;
      await wait(500);
      check("learning pauses the simulation", doc.getElementById("clockLabel").textContent === frozenClock, `${frozenClock} → ${doc.getElementById("clockLabel").textContent}`);

      doc.getElementById("knowledgeCheckButton").click();
      await wait(80);
      check("knowledge check asks a cause-and-effect question", doc.getElementById("quizTitle")?.textContent === "Environmental knowledge check" && doc.querySelectorAll(".quiz-choice").length === 3);
      doc.querySelector('.quiz-choice[data-answer="1"]').click();
      await wait(80);
      check("correct answer receives an explanation", doc.getElementById("quizFeedback").classList.contains("correct") && doc.getElementById("quizFeedback").textContent.includes("habitat"), doc.getElementById("quizFeedback").textContent);
      check("knowledge progress updates", canvas.dataset.learningQuizCorrect === "1" && canvas.dataset.learningQuizAttempts === "1", `${canvas.dataset.learningQuizCorrect}/${canvas.dataset.learningQuizAttempts}`);
      const resourcesAfter = ["foodValue", "waterValue", "woodValue", "stoneValue"].map(id => doc.getElementById(id).textContent).join("|");
      check("learning does not alter game resources", resourcesAfter === resourcesBefore, `${resourcesBefore} → ${resourcesAfter}`);

      doc.getElementById("quizGuideButton").click();
      await wait(80);
      check("field guide remembers knowledge score", doc.querySelector(".knowledge-score")?.textContent.includes("1/22"), doc.querySelector(".knowledge-score")?.textContent || "missing");
      const saved = JSON.parse(win.localStorage.getItem("wildroot-village-save-v1") || "{}");
      check("learning progress saves", saved.learning?.completedLessons?.includes("living_system") && saved.learning?.quizAnswered?.includes("forest_connections") && saved.learning?.quizAttempts === 1, JSON.stringify(saved.learning || {}));
      doc.getElementById("closeFieldGuideButton").click();
      await wait(80);

      doc.getElementById("inspectTool").click();
      clickWorld(win, canvas, 50.5, 50.5);
      await wait(100);
      const buildingInspection = doc.querySelector(".inspection-grid")?.textContent || "";
      check("building inspection teaches environmental tradeoffs", buildingInspection.includes("Environmental lesson") && buildingInspection.includes("Ask as steward"), buildingInspection || "missing");
      check("quiet housing is not incorrectly labelled noise-exposed", buildingInspection.includes("No noise source reaches this home") && buildingInspection.includes("No active wellbeing loss") && !buildingInspection.includes("residents exposed"), buildingInspection || "missing");
      doc.querySelector(".sheet-close").click();
      await wait(80);
      doc.getElementById("achievementsButton").click();
      await wait(80);
      check("achievement sheet lists Perfect Balance", (doc.querySelector(".achievement-grid")?.textContent || "").includes("Perfect Balance") && (doc.querySelector(".achievement-grid")?.textContent || "").includes("Harsh difficulty"), doc.querySelector(".achievement-grid")?.textContent || "missing");
      win.__wildrootTest.openEvent("flood");
      await wait(80);
      check("random events include an environmental learning lens", (doc.querySelector("[data-event-learning-lens]")?.textContent || "").includes("Floodplains and wetlands"), doc.querySelector("[data-event-learning-lens]")?.textContent || "missing");
    } catch (error) {
      checks.push({ name: "uncaught test error", pass: false, detail: String(error?.stack || error) });
    }
    const passed = checks.every(item => item.pass);
    result.textContent = `${passed ? "PASS" : "FAIL"}\n` + checks.map(item => `${item.pass ? "✓" : "✗"} ${item.name}${item.detail ? ` — ${item.detail}` : ""}`).join("\n");
    document.title = passed ? "PASS" : "FAIL";
  }, { once: true });
  frame.src = "../index.html?test=learning";
</script>
