<!doctype html>
<meta charset="utf-8">
<title>Wildroot weather test</title>
<style>body{font-family:monospace} iframe{width:1400px;height:1000px;border:0}</style>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1400px;height:1000px;border:0"></iframe>
<script>
  localStorage.setItem("wildroot-village-save-v1", JSON.stringify({
    version: 2,
    villageName: "Weather Clock",
    difficulty: "balanced",
    day: 6,
    dayProgress: .25,
    speed: 1,
    paused: true,
    weather: "mild",
    weatherFrom: "mild",
    weatherBlend: 1,
    nextWeatherChange: 6.2502,
    population: 16,
    demographics: { children: 0, adults: 16, elders: 0 },
    terrainSeed: 913472,
    buildings: [
      { type: "hearth", x: 49, y: 49, rotation: 0, builtDay: 1, id: 1 },
      { type: "farm", x: 43, y: 53, rotation: 0, builtDay: 3, id: 2 },
      { type: "farm", x: 47, y: 53, rotation: 0, builtDay: 4, id: 3 },
      { type: "lumber", x: 40, y: 46, rotation: 0, builtDay: 4, id: 4 },
      { type: "quarry", x: 43, y: 45, rotation: 0, builtDay: 5, id: 5 },
      { type: "rain_garden", x: 53, y: 49, rotation: 0, builtDay: 5, id: 6 }
    ],
    nextBuildingId: 7,
    camera: { x: 50, y: 50, zoom: .85 }
  }));

  const frame = document.getElementById("game");
  const result = document.getElementById("result");
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  frame.addEventListener("load", async () => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const checks = [];
    const check = (name, pass, detail = "") => checks.push({ name, pass: Boolean(pass), detail });
    try {
      await wait(250);
      doc.getElementById("continueGameButton").click();
      doc.querySelector('[data-speed="3"]').click();
      win.__wildrootTest.step(900);
      const canvas = doc.getElementById("gameCanvas");
      check("simulation loop running", Number(canvas.dataset.weatherVisualTime) > 0 && doc.querySelector('[data-speed="3"]').classList.contains("active"), canvas.dataset.weatherVisualTime);
      const movingBlend = Number(canvas.dataset.weatherBlend);
      check("weather changes between day boundaries", canvas.dataset.weather !== "mild" && canvas.dataset.weatherFrom === "mild", `${canvas.dataset.weatherFrom} → ${canvas.dataset.weather}`);
      check("weather fades gradually", movingBlend > 0 && movingBlend < 1, movingBlend);
      check("weather has real-life duration profiles", canvas.dataset.stormTypicalHours === "2" && canvas.dataset.cloudyTypicalDays === "4" && canvas.dataset.heatwaveTypicalDays === "3" && canvas.dataset.weatherConditionCount === "13", `${canvas.dataset.stormTypicalHours}h storm · ${canvas.dataset.cloudyTypicalDays}d cloudy · ${canvas.dataset.heatwaveTypicalDays}d heatwave`);
      check("incoming weather receives its own duration", Number(canvas.dataset.weatherDurationDays) > Number(canvas.dataset.weatherFadeDays) && Number(canvas.dataset.weatherRemainingDays) > 0, `${canvas.dataset.weatherDurationDays}d total · ${canvas.dataset.weatherRemainingDays}d left`);
      check("header shows weather time remaining", doc.getElementById("weatherLabel").textContent.includes("left"), doc.getElementById("weatherLabel").textContent);

      doc.getElementById("pauseButton").click();
      await wait(380);
      const pausedBlend = canvas.dataset.weatherBlend;
      const pausedVisual = canvas.dataset.weatherVisualTime;
      const pausedRemaining = canvas.dataset.weatherRemainingDays;
      const pausedClock = doc.getElementById("clockLabel").textContent;
      win.__wildrootTest.step(720);
      check("weather transition freezes while paused", canvas.dataset.weatherBlend === pausedBlend, `${pausedBlend} → ${canvas.dataset.weatherBlend}`);
      check("weather animation freezes while paused", canvas.dataset.weatherVisualTime === pausedVisual, `${pausedVisual} → ${canvas.dataset.weatherVisualTime}`);
      check("weather duration freezes while paused", canvas.dataset.weatherRemainingDays === pausedRemaining, `${pausedRemaining} → ${canvas.dataset.weatherRemainingDays}`);
      check("day clock freezes while paused", doc.getElementById("clockLabel").textContent === pausedClock, `${pausedClock} → ${doc.getElementById("clockLabel").textContent}`);

      doc.getElementById("pauseButton").click();
      win.__wildrootTest.step(720);
      check("weather resumes with time", Number(canvas.dataset.weatherBlend) > Number(pausedBlend) && Number(canvas.dataset.weatherVisualTime) > Number(pausedVisual), `${pausedBlend}/${pausedVisual} → ${canvas.dataset.weatherBlend}/${canvas.dataset.weatherVisualTime}`);
      check("weather countdown resumes with time", Number(canvas.dataset.weatherRemainingDays) < Number(pausedRemaining), `${pausedRemaining} → ${canvas.dataset.weatherRemainingDays}`);
      check("childhood is seven days", canvas.dataset.childhoodDays === "7", canvas.dataset.childhoodDays);
      check("pollution only targets crops", canvas.dataset.pollutionTargets === "crops-only" && canvas.dataset.farmPolluters === "0", `${canvas.dataset.pollutionTargets} · ${canvas.dataset.farmPolluters} farm polluters`);
      check("adjacent farms do not pollute each other", canvas.dataset.cropPollutionLoss === "0", `${canvas.dataset.cropPollutionLoss}% output loss`);
      check("adjacent timber and stone sites do not suppress output", canvas.dataset.rawProducerPollutionLoss === "0", `${canvas.dataset.rawProducerPollutionLoss}% output loss`);
      const summerFadeStart = win.__wildrootTest.autumnProgress(22, 0);
      const springShift = win.__wildrootTest.staffedShift(6);
      const summerShift = win.__wildrootTest.staffedShift(15);
      const autumnShift = win.__wildrootTest.staffedShift(27);
      const winterShift = win.__wildrootTest.staffedShift(38);
      check("staffed hours follow the seasons", springShift.end === 18.5 && summerShift.end === 20.5 && autumnShift.end === 18.5 && winterShift.end === 17.5 && summerShift.fraction > springShift.fraction && winterShift.fraction < springShift.fraction, `${springShift.end}/${summerShift.end}/${autumnShift.end}/${winterShift.end}`);
      const autumnDayOne = win.__wildrootTest.autumnProgress(25, 0);
      const autumnFadeEnd = win.__wildrootTest.autumnProgress(27, 0);
      check("autumn colour fade spans summer’s last three and autumn’s first two days", summerFadeStart === 0 && Math.abs(autumnDayOne - .6) < .0001 && autumnFadeEnd === 1 && canvas.dataset.autumnTransitionDays === "5", `${summerFadeStart} → ${autumnDayOne} → ${autumnFadeEnd}`);
      const summerGreen = win.__wildrootTest.treeColours("summer", 0, .5).join(",");
      const autumnRed = win.__wildrootTest.treeColours("autumn", 1, 0).join(",");
      const autumnYellow = win.__wildrootTest.treeColours("autumn", 1, 1).join(",");
      check("autumn trees range from red to yellow", summerGreen !== autumnRed && autumnRed !== autumnYellow && summerGreen !== autumnYellow, `${autumnRed} · ${autumnYellow}`);
      const lateAutumnStart = win.__wildrootTest.deciduousCanopy(34, 0);
      const lateAutumnMid = win.__wildrootTest.deciduousCanopy(35, .5);
      const winterBare = win.__wildrootTest.deciduousCanopy(37, 0);
      const earlySpring = win.__wildrootTest.deciduousCanopy(2, 0);
      const springFull = win.__wildrootTest.deciduousCanopy(4, 0);
      check("deciduous leaves fade out before winter", lateAutumnStart === 1 && lateAutumnMid > 0 && lateAutumnMid < 1 && winterBare === 0 && canvas.dataset.autumnLeafDropDays === "3", `${lateAutumnStart} → ${lateAutumnMid.toFixed(3)} → ${winterBare}`);
      check("deciduous trees fade back in during early spring", earlySpring > 0 && earlySpring < 1 && springFull === 1 && canvas.dataset.springLeafGrowthDays === "3", `${earlySpring.toFixed(3)} → ${springFull}`);
      let evergreenCount = 0;
      for (let y = 0; y < 100; y++) for (let x = 0; x < 100; x++) evergreenCount += Number(win.__wildrootTest.isEvergreen(x, y, 913472));
      const evergreenPercent = evergreenCount / 100;
      const evergreenSummer = win.__wildrootTest.treeColours("summer", 0, .3, true).join(",");
      const evergreenAutumn = win.__wildrootTest.treeColours("autumn", 1, .8, true).join(",");
      const evergreenWinter = win.__wildrootTest.treeColours("winter", 0, .5, true).join(",");
      check("about ten percent of trees are stable evergreens", evergreenPercent >= 9 && evergreenPercent <= 11 && canvas.dataset.evergreenPercent === "10", `${evergreenCount} / 10000 · ${evergreenPercent.toFixed(2)}%`);
      check("evergreens remain green in every season", evergreenSummer === evergreenAutumn && evergreenAutumn === evergreenWinter, evergreenWinter);
      check("winter deciduous canopy is fully leafless", winterBare === 0 && canvas.dataset.winterDeciduousLeaves === "0", `${winterBare} canopy`);
      check("Windmills need no workers", canvas.dataset.windmillJobs === "0" && doc.querySelector('[data-building="windmill"]')?.dataset.jobs === "0", `${canvas.dataset.windmillJobs} jobs`);
      const farmStaffing = [0, 1, 2, 3].map(workers => win.__wildrootTest.staffingMultiplier("farm", workers));
      const rainGardenStaffing = [0, 1, 2, 3].map(workers => win.__wildrootTest.staffingMultiplier("rain_garden", workers));
      check("Farms accept three workers and reach 2× output", farmStaffing.join(",") === "0,0.5,1,2" && canvas.dataset.farmWorkerCapacity === "3" && canvas.dataset.farmFullStaffProduction === "2", farmStaffing.join(" → "));
      check("Rain Gardens keep a worker-free baseline and accept three optional helpers", canvas.dataset.rainGardenJobs === "0" && canvas.dataset.rainGardenWorkerCapacity === "3" && canvas.dataset.rainGardenOptionalWorkers === "3" && canvas.dataset.rainGardenAssignedWorkers === "3" && canvas.dataset.fullyStaffedRainGardens === "1" && doc.querySelector('[data-building="rain_garden"]')?.dataset.jobs === "0" && doc.querySelector('[data-building="rain_garden"]')?.dataset.workerCapacity === "3", `${canvas.dataset.rainGardenJobs} required · ${canvas.dataset.rainGardenAssignedWorkers}/${canvas.dataset.rainGardenWorkerCapacity} assigned`);
      check("three Rain Garden helpers reach 2× daytime output", Math.abs(rainGardenStaffing[0] - 1) < .0001 && Math.abs(rainGardenStaffing[1] - 4 / 3) < .0001 && Math.abs(rainGardenStaffing[2] - 5 / 3) < .0001 && rainGardenStaffing[3] === 2 && win.__wildrootTest.staffingMultiplier("rain_garden", 3, false) === 1, `${rainGardenStaffing.map(value => value.toFixed(2)).join(" → ")} · night 1×`);
    } catch (error) {
      checks.push({ name: "uncaught test error", pass: false, detail: String(error?.stack || error) });
    }
    const passed = checks.every(item => item.pass);
    result.textContent = `${passed ? "PASS" : "FAIL"}\n` + checks.map(item => `${item.pass ? "✓" : "✗"} ${item.name}${item.detail ? ` — ${item.detail}` : ""}`).join("\n");
    document.title = passed ? "PASS" : "FAIL";
  }, { once: true });
  frame.src = "../index.html?test=weather";
</script>
